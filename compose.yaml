name: solo62-pavedesk
services:
  bench:
    build:
      context: .
      args:
        PAVEDESK_DEPS_IMAGE: ${PAVEDESK_DEPS_IMAGE:-python:3.11-slim}
    image: ${PAVEDESK_IMAGE:-solo62-pavedesk:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      WAITRESS_THREADS: 4
    ports:
      - "127.0.0.1:${PAVEDESK_PORT:-19964}:8000"
    volumes:
      - surface-library:/var/lib/pavedesk
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200"]
      interval: 4s
      timeout: 4s
      retries: 12
volumes:
  surface-library:
